[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "duo-pecfit"
version = "0.1.0"
description = "Automatic single-state EMO/MLJ PEC and rotational BOB fitting with Duo"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
localized = ["numpy>=1.24", "scipy>=1.10"]
plots = ["numpy>=1.24", "matplotlib>=3.6"]

[project.scripts]
pecfit = "pecfit.__main__:main"

[tool.setuptools.packages.find]
include = ["pecfit*"]
